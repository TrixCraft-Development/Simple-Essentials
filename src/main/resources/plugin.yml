    default: op
  simpleessentials.ban:
    description: Allows banning players
    default: op
  simpleessentials.tempmute:
    description: Allows temporarily muting players
    default: op
  simpleessentials.mute:
    description: Allows muting players
    default: op
  simpleessentials.banlist:
    description: Allows viewing the ban/mute list
    default: op
  simpleessentials.banlog:
    description: Allows viewing moderation history
    default: op
  simpleessentials.banlog.clear:
    description: Allows clearing moderation history
    default: op
  simpleessentials.unban:
    description: Allows unbanning players
